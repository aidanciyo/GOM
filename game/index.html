<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0914">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GOM Pizza Delivery</title>
<link rel="icon" href="assets/img/icon.png">

<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0914; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: absolute; left: 0; top: 0;
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none; outline: none;
  }
  #rotate {
    display: none; position: absolute; inset: 0; background: #0b0914; color: #f5b800;
    font: bold 20px monospace; align-items: center; justify-content: center; text-align: center;
    padding: 24px; box-sizing: border-box;
  }
  @media (orientation: portrait) and (max-width: 820px) {
    body.touch #rotate { display: flex; }
  }
</style>
</head>
<body>
<canvas id="game" tabindex="1"></canvas>
<div id="rotate">GIRA EL MÓVIL<br>PARA JUGAR ↻</div>
